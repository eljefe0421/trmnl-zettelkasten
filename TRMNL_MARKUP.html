<div class="container" style="display: flex; flex-direction: column; height: 100%; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: white; color: black;">

  <!-- Header with Type Badge and Title -->
  <div style="margin-bottom: 24px;">
    <div style="display: inline-block; background: black; color: white; padding: 6px 14px; border-radius: 3px; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 14px; text-transform: uppercase;">
      {{ type }}
    </div>
    <h1 style="margin: 0; font-size: 42px; font-weight: 700; line-height: 1.2; margin-bottom: 16px;">
      {{ title }}
    </h1>
  </div>

  <!-- Tags -->
  {% if tags %}
  <div style="margin-bottom: 20px; font-size: 18px; color: #666;">
    <span style="font-weight: 500;">Tags:</span> {{ tags }}
  </div>
  {% endif %}

  <!-- Main Body Content -->
  <div style="flex-grow: 1;">
    <div style="font-size: 22px; line-height: 1.6; color: #222; word-wrap: break-word; white-space: pre-wrap;">
      {{ body }}
    </div>
  </div>

</div>
