<div class="container" style="display: flex; flex-direction: column; height: 100%; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: white; color: black;">

  <!-- Header with Type Badge and Title -->
  <div style="margin-bottom: 20px;">
    <div style="display: inline-block; background: black; color: white; padding: 5px 12px; border-radius: 3px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px; text-transform: uppercase;">
      {{ type }}
    </div>
    <h1 style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1.2; margin-bottom: 12px;">
      {{ title }}
    </h1>
  </div>

  <!-- Main Body Content -->
  <div style="flex-grow: 1; overflow: hidden;">
    <div style="font-size: 20px; line-height: 1.5; color: #222; word-wrap: break-word; white-space: pre-wrap;">
      {{ body }}
    </div>
  </div>

</div>
