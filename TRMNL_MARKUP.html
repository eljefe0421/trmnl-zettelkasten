<div class="container" style="display: flex; flex-direction: column; height: 100%; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: white; color: black;">

  <!-- Header with Type Badge and Title -->
  <div style="margin-bottom: 20px;">
    <div style="display: inline-block; background: black; color: white; padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px; text-transform: uppercase;">
      {{ type }}
    </div>
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 16px;">
      {{ title }}
    </h1>
  </div>

  <!-- Tags -->
  {% if tags %}
  <div style="margin-bottom: 16px; font-size: 13px; color: #666;">
    <span style="font-weight: 500;">Tags:</span> {{ tags }}
  </div>
  {% endif %}

  <!-- Main Body Content -->
  <div style="flex-grow: 1; margin-bottom: 20px;">
    <div style="font-size: 15px; line-height: 1.6; color: #222; word-wrap: break-word; white-space: pre-wrap;">
      {{ body }}
    </div>
  </div>

  <!-- Footer with Source -->
  <div style="border-top: 1px solid #ddd; padding-top: 12px; font-size: 12px; color: #888;">
    <span style="font-weight: 500;">Source:</span> {{ source }}
  </div>

</div>
